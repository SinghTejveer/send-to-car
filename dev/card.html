<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Send to Car card harness</title>
<!-- A development page: the card with stand-ins for Home Assistant's ha-card, ha-icon and the send_to_car actions. Serve the repo root and open
     /dev/card.html. Add ?dark for the dark theme, ?empty for no saved places, ?fail to make sending fail, ?metric for a metric Home Assistant, ?units=mi or ?units=km for the card option. -->
<style>
  :root{--primary-color:#03a9f4;--rgb-primary-color:3,169,244;--primary-text-color:#212121;--secondary-text-color:#727272;--text-primary-color:#fff;
    --card-background-color:#fff;--secondary-background-color:#f5f5f5;--divider-color:rgba(0,0,0,.12);--success-color:#2e7d32;--rgb-success-color:76,175,80;
    --error-color:#db4437;--rgb-error-color:219,68,55;--warning-color:#ff9800;--bg:#fafafa;color-scheme:light}
  :root.dark{--primary-color:#03a9f4;--primary-text-color:#e1e1e1;--secondary-text-color:#9b9b9b;--card-background-color:#1c1c1c;
    --secondary-background-color:#282828;--divider-color:rgba(225,225,225,.12);--success-color:#81c784;--bg:#111;color-scheme:dark}
  body{margin:0;background:var(--bg);font-family:Roboto,system-ui,sans-serif;font-size:14px;padding:24px max(16px,env(safe-area-inset-left,0px))}
  .wrap{max-width:440px;margin:0 auto}
  ha-card{display:block;background:var(--card-background-color);border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
  #log{max-width:440px;margin:16px auto 0;font:12px/1.5 ui-monospace,Consolas,monospace;color:var(--secondary-text-color);white-space:pre-wrap}
</style>
<script>
  const P = new URLSearchParams(location.search);
  if (P.has("dark")) document.documentElement.classList.add("dark");
  // Like Home Assistant's ha-card, styled from inside its own shadow root so it works within the card's shadow root too.
  customElements.define("ha-card", class extends HTMLElement {
    constructor() { super(); this.attachShadow({ mode: "open" }).innerHTML = `<style>:host{display:block;background:var(--card-background-color);border-radius:12px;
      box-shadow:0 1px 3px rgba(0,0,0,.14);color:var(--primary-text-color)}</style><slot></slot>`; }
  });
  // Real Material Design Icons paths (from @mdi/js 7.4.47) for the icons the card uses, so screenshots match Home Assistant.
  const MDI = {"mdi:calendar-clock": "M15,13H16.5V15.82L18.94,17.23L18.19,18.53L15,16.69V13M19,8H5V19H9.67C9.24,18.09 9,17.07 9,16A7,7 0 0,1 16,9C17.07,9 18.09,9.24 19,9.67V8M5,21C3.89,21 3,20.1 3,19V5C3,3.89 3.89,3 5,3H6V1H8V3H16V1H18V3H19A2,2 0 0,1 21,5V11.1C22.24,12.36 23,14.09 23,16A7,7 0 0,1 16,23C14.09,23 12.36,22.24 11.1,21H5M16,11.15A4.85,4.85 0 0,0 11.15,16C11.15,18.68 13.32,20.85 16,20.85A4.85,4.85 0 0,0 20.85,16C20.85,13.32 18.68,11.15 16,11.15Z", "mdi:close": "M19,6.41L17.59,5L12,10.59L6.41,5L5,6.41L10.59,12L5,17.59L6.41,19L12,13.41L17.59,19L19,17.59L13.41,12L19,6.41Z", "mdi:history": "M13.5,8H12V13L16.28,15.54L17,14.33L13.5,12.25V8M13,3A9,9 0 0,0 4,12H1L4.96,16.03L9,12H6A7,7 0 0,1 13,5A7,7 0 0,1 20,12A7,7 0 0,1 13,19C11.07,19 9.32,18.21 8.06,16.94L6.64,18.36C8.27,20 10.5,21 13,21A9,9 0 0,0 22,12A9,9 0 0,0 13,3", "mdi:magnify": "M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z", "mdi:mailbox-outline": "M17,4H7A5,5 0 0,0 2,9V20H20A2,2 0 0,0 22,18V9A5,5 0 0,0 17,4M10,18H4V9A3,3 0 0,1 7,6A3,3 0 0,1 10,9V18M20,18H12V9C12,7.92 11.65,6.86 11,6H17A3,3 0 0,1 20,9V18M13,11V13H17V15H19V11H13M9,11H5V9H9V11Z", "mdi:map-marker": "M12,11.5A2.5,2.5 0 0,1 9.5,9A2.5,2.5 0 0,1 12,6.5A2.5,2.5 0 0,1 14.5,9A2.5,2.5 0 0,1 12,11.5M12,2A7,7 0 0,0 5,9C5,14.25 12,22 12,22C12,22 19,14.25 19,9A7,7 0 0,0 12,2Z", "mdi:map-marker-down": "M12 2A7 7 0 0 0 5 9C5 14.25 12 22 12 22S19 14.25 19 9A7 7 0 0 0 12 2M7.5 10H10V5H14V10H16.5L12 14.5Z", "mdi:map-marker-outline": "M12,6.5A2.5,2.5 0 0,1 14.5,9A2.5,2.5 0 0,1 12,11.5A2.5,2.5 0 0,1 9.5,9A2.5,2.5 0 0,1 12,6.5M12,2A7,7 0 0,1 19,9C19,14.25 12,22 12,22C12,22 5,14.25 5,9A7,7 0 0,1 12,2M12,4A5,5 0 0,0 7,9C7,10 7,12 12,18.71C17,12 17,10 17,9A5,5 0 0,0 12,4Z", "mdi:map-marker-radius": "M12,2C15.31,2 18,4.66 18,7.95C18,12.41 12,19 12,19C12,19 6,12.41 6,7.95C6,4.66 8.69,2 12,2M12,6A2,2 0 0,0 10,8A2,2 0 0,0 12,10A2,2 0 0,0 14,8A2,2 0 0,0 12,6M20,19C20,21.21 16.42,23 12,23C7.58,23 4,21.21 4,19C4,17.71 5.22,16.56 7.11,15.83L7.75,16.74C6.67,17.19 6,17.81 6,18.5C6,19.88 8.69,21 12,21C15.31,21 18,19.88 18,18.5C18,17.81 17.33,17.19 16.25,16.74L16.89,15.83C18.78,16.56 20,17.71 20,19Z", "mdi:star": "M12,17.27L18.18,21L16.54,13.97L22,9.24L14.81,8.62L12,2L9.19,8.62L2,9.24L7.45,13.97L5.82,21L12,17.27Z"};
  customElements.define("ha-icon", class extends HTMLElement {
    static get observedAttributes() { return ["icon"]; }
    attributeChangedCallback() { const d = MDI[this.getAttribute("icon")];
      this.innerHTML = d ? `<svg viewBox="0 0 24 24" style="width:var(--mdc-icon-size,24px);height:var(--mdc-icon-size,24px);display:block;fill:currentColor"><path d="${d}"/></svg>` : "●"; }
  });
</script>
<script src="../custom_components/send_to_car/www/send-to-car-card.js"></script>
</head>
<body>
<div class="wrap" id="wrap"></div>
<div id="log"></div>
<script>
  const log = (m) => (document.getElementById("log").textContent += m + "\n");
  const places = [
    { source: "google", name: "St John's (Upper) Car Park", address: "Luton Road, Chatham ME4 4BY", place_id: "a", latitude: null, longitude: null, distance_km: 13.4, distance_mi: 8.3, duplicates: 2 },
    { source: "google", name: "St John's Car Park", address: "Clover Street, Chatham ME4 6AB", place_id: "b", latitude: null, longitude: null, distance_km: 13.0, distance_mi: 8.1, duplicates: 2 },
    { source: "google", name: "St John's Church", address: "Railway Street, Chatham", place_id: "c", latitude: null, longitude: null, distance_km: 13.2, distance_mi: 8.2, duplicates: 0 },
  ];
  let favs = P.has("empty") ? [] : [{ source: "favourite", name: "Waterfront Way", address: "Chatham ME4 4DH", latitude: 51.38, longitude: 0.53, place_id: null, distance_km: 13.7, distance_mi: 8.5, duplicates: 0 }];
  const sugg = () => ({
    car: { name: "Model 3", battery: 78, range: 231, range_unit: "mi" },
    google: true,
    calendar: P.has("empty") ? [] : [{ source: "calendar", name: "Dentist", address: "12 High Street, Rochester ME1 1PY", time: "15:30" }],
    favourites: favs,
    recent: P.has("empty") ? [] : [{ source: "recent", name: "Dockside Outlet Centre", address: "Chatham ME4 4LL", latitude: 51.39, longitude: 0.54, distance_km: 13.4, distance_mi: 8.3, duplicates: 0 }],
    zones: [{ source: "zone", name: "Home", address: "", latitude: 51.44, longitude: 0.37, distance_km: 0, distance_mi: 0, duplicates: 0 }],
    last: null,
  });
  const hass = {
    config: { unit_system: { length: P.has("metric") ? "km" : "mi" } },
    connection: {
      async sendMessagePromise(msg) {
        log(`→ ${msg.service} ${JSON.stringify(msg.service_data)}`);
        await new Promise((r) => setTimeout(r, 150));
        const d = msg.service_data;
        if (msg.service === "suggestions") return { response: sugg() };
        if (msg.service === "search") {
          const q = d.query.toLowerCase();
          const hits = [...favs, ...places].filter((p) => q.split(/\s+/).every((w) => (p.name + " " + p.address).toLowerCase().replace(/'/g, "").includes(w.replace(/'/g, ""))));
          return { response: { query: d.query, results: hits.slice(0, 5), source: "google", notes: [] } };
        }
        if (msg.service === "send") {
          if (P.has("fail")) throw { message: "Could not find “nowhere”. Try adding the town or the postcode." };
          return { response: { car: "Model 3", name: d.name, address: d.address || "", latitude: 51.381, longitude: 0.531 } };
        }
        if (msg.service === "add_favourite") {
          const added = !favs.some((f) => f.name === d.name);
          if (added) favs = [...favs, { source: "favourite", name: d.name, address: d.address || "", latitude: 51.38, longitude: 0.53, distance_km: 13, distance_mi: 8.1, duplicates: 0 }];
          return { response: { added, name: d.name } };
        }
        if (msg.service === "remove_favourite") {
          favs = favs.filter((f) => f.name !== d.name);
          return { response: { removed: true } };
        }
        throw { message: "Unknown action" };
      },
    },
  };
  const card = document.createElement("send-to-car-card");
  card.setConfig({ type: "custom:send-to-car-card", ...(P.get("units") ? { units: P.get("units") } : {}) });
  card.hass = hass;
  document.getElementById("wrap").appendChild(card);
  window.card = card;
</script>
</body>
</html>
