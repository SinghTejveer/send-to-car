[project]
name = "send-to-car"
version = "0.1.0"
description = "Home Assistant integration: search places, postcodes and calendar locations and send them to your car's navigation."
requires-python = ">=3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py313"
